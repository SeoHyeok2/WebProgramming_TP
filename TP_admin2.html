<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP미용실 관리자</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="TP_admin2.css">
</head>
<body>
    <h1>WP미용실 충남대점</h1> <br><br>
    <div id="layout">
        <ul>
            <li>
                <span>디자이너 이름</span>
                <br>
                <input type="text" id="designerName">
            </li> <br>
            <li>
                <span>시술명</span>
                <input type="text" name="design" id="design1">
                <span>시술 비용</span>
                <input type="text" name="cost" id="cost1">
                <span>시술 설명</span>
                <input type="text" name="explain" id="explain1">
                <span>시술 소요 시간(30분 간격)</span>
                <input type="number" name="time" id="time1" value="0" min="0" step="30">
            </li><br>
            <li id="li">
                <button id="addButton">시술 추가</button>
                <button id="saveButton">디자이너 정보 저장</button>
            </li>
        </ul>
    </div>
    <script src="TP_admin2.js"></script>
</body>
</html>
